<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
overflow:hidden;
background:#0d0518;
padding:15px;
position:relative;
}

/* ===== BACKGROUND ===== */
.bg-animation{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-3;
background:
radial-gradient(circle at 20% 30%,rgba(120,40,180,.4) 0%,transparent 45%),
radial-gradient(circle at 80% 20%,rgba(160,60,220,.3) 0%,transparent 40%),
radial-gradient(circle at 70% 80%,rgba(90,20,140,.35) 0%,transparent 45%),
radial-gradient(circle at 30% 70%,rgba(140,50,200,.25) 0%,transparent 40%),
#0d0518;
animation:bgPulse 8s ease-in-out infinite alternate;
}

@keyframes bgPulse{
0%{filter:hue-rotate(0deg) brightness(1);}
100%{filter:hue-rotate(8deg) brightness(1.12);}
}

.web{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
background-image:
linear-gradient(rgba(160,80,255,.07) 1px,transparent 1px),
linear-gradient(90deg,rgba(160,80,255,.07) 1px,transparent 1px);
background-size:55px 55px;
animation:webMove 20s linear infinite;
opacity:.7;
}

@keyframes webMove{
0%{background-position:0 0;}
100%{background-position:55px 55px;}
}

.glow{
position:fixed;
width:300px;
height:300px;
border-radius:50%;
filter:blur(80px);
z-index:-1;
opacity:.5;
animation:floatGlow 12s ease-in-out infinite;
}

.glow.red{
background:#9b30ff;
top:8%;
left:5%;
}

.glow.blue{
background:#c44dff;
bottom:8%;
right:5%;
animation-delay:4s;
}

@keyframes floatGlow{
0%,100%{
transform:translate(0,0) scale(1);
}
50%{
transform:translate(35px,28px) scale(1.2);
}
}

/* ===== CONTAINER ===== */
.container{
width:100%;
max-width:430px;
padding:18px 6px 28px;
text-align:center;
position:relative;
z-index:5;
}

/* ===== HERO ===== */
.hero{
position:relative;
overflow:hidden;
padding:20px 18px 22px;
border:1px solid rgba(255,255,255,.11);
border-radius:28px;
background:
linear-gradient(
145deg,
rgba(255,255,255,.10),
rgba(255,255,255,.035)
);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
box-shadow:
0 20px 60px rgba(0,0,0,.30),
inset 0 1px rgba(255,255,255,.10);
}

.hero-orb{
position:absolute;
width:180px;
height:180px;
border-radius:50%;
top:-95px;
right:-70px;
background:rgba(196,77,255,.25);
filter:blur(15px);
}

/* ===== TEMPAT GIF ===== */
.gif-container{
position:relative;
width:100%;
height:180px;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 18px;
overflow:hidden;
}

/* Ukuran GIF dibuat lebih kecil */
.hero-gif{
position:absolute;
width:auto;
height:auto;
max-width:220px;
max-height:160px;
object-fit:contain;
display:block;
border-radius:16px;
border:1px solid rgba(220,160,255,.38);
box-shadow:
0 0 15px rgba(170,70,255,.32),
0 0 30px rgba(120,40,200,.18);
background:#140720;

opacity:0;
transform:scale(.96);

transition:
opacity .7s ease,
transform .7s ease;
}

.hero-gif.active{
opacity:1;
transform:scale(1);
}

/* ===== TEXT ===== */
.hero-kicker{
position:relative;
color:#d9b6ff;
font-size:10px;
font-weight:800;
letter-spacing:3px;
margin-bottom:9px;
}

.hero h1{
position:relative;
margin:0;
color:#fff;
font-size:34px;
line-height:1.05;
font-weight:900;
letter-spacing:-1px;
text-shadow:0 5px 30px rgba(0,0,0,.25);
}

.hero p{
position:relative;
margin:14px auto 0;
max-width:340px;
color:rgba(239,228,255,.72);
font-size:13px;
line-height:1.65;
}

/* ===== CONTOH MENU NETRAL ===== */
.menu-grid{
display:grid;
gap:11px;
margin-top:18px;
}

.menu-card{
display:flex;
align-items:center;
gap:13px;
min-height:74px;
padding:12px 13px;
color:#fff;
text-decoration:none;
text-align:left;
border:1px solid rgba(255,255,255,.10);
border-radius:20px;
background:
linear-gradient(
110deg,
rgba(255,255,255,.10),
rgba(255,255,255,.045)
);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
box-shadow:
0 12px 35px rgba(0,0,0,.22),
inset 0 1px rgba(255,255,255,.08);
}

.card-icon{
width:46px;
height:46px;
flex:0 0 46px;
display:flex;
align-items:center;
justify-content:center;
border-radius:15px;
color:#fff;
font-size:20px;
background:
linear-gradient(
145deg,
rgba(196,77,255,.95),
rgba(103,35,190,.95)
);
}

.card-copy{
min-width:0;
flex:1;
}

.card-copy strong{
display:block;
font-size:15px;
font-weight:800;
}

.card-copy small{
display:block;
margin-top:4px;
color:rgba(235,220,255,.60);
font-size:11px;
}

.card-arrow{
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
color:#fff;
background:rgba(255,255,255,.08);
}

/* ===== RESPONSIVE ===== */
@media(max-width:380px){

.hero{
padding:18px 15px 20px;
}

.gif-container{
height:150px;
}

.hero-gif{
max-width:185px;
max-height:135px;
}

.hero h1{
font-size:30px;
}

}

@media(min-width:420px){

.gif-container{
height:190px;
}

.hero-gif{
max-width:220px;
max-height:160px;
}

.hero h1{
font-size:36px;
}

}
</style>
</head>

<body>

<div class="bg-animation"></div>
<div class="web"></div>
<div class="glow red"></div>
<div class="glow blue"></div>

<div class="container">

<div class="hero">

<div class="hero-orb"></div>

<!-- ===== SEMUA GIF DALAM SATU TEMPAT ===== -->
<div class="gif-container">

<img
class="hero-gif active"
src="https://files.catbox.moe/m5o7wo.gif"
alt="Animation 1"
>

<img
class="hero-gif"
src="https://files.catbox.moe/pq3a8b.gif"
alt="Animation 2"
>

<img
class="hero-gif"
src="https://files.catbox.moe/5moa8g.gif"
alt="Animation 3"
>

<img
class="hero-gif"
src="https://files.catbox.moe/ij8fnk.gif"
alt="Animation 4"
>

</div>

<div class="hero-kicker">
SELAMAT DATANG
</div>

<h1>
SELAMAT BERMAIN
</h1>

<p>
Pilih menu favoritmu dan temukan penawaran terbaik
</p>

</div>

<div class="menu-grid">

<a class="menu-card" href="#" aria-label="Menu 1">
<div class="card-icon">⌂</div>
<div class="card-copy">
<strong>MENU UTAMA</strong>
<small>Jelajahi pilihan terbaru</small>
</div>
<div class="card-arrow">→</div>
</a>

<a class="menu-card" href="#" aria-label="Menu 2">
<div class="card-icon">✦</div>
<div class="card-copy">
<strong>PROMO</strong>
<small>Lihat penawaran pilihan</small>
</div>
<div class="card-arrow">→</div>
</a>

<a class="menu-card" href="#" aria-label="Menu 3">
<div class="card-icon">◇</div>
<div class="card-copy">
<strong>KOLEKSI</strong>
<small>Produk yang sedang populer</small>
</div>
<div class="card-arrow">→</div>
</a>

</div>

</div>

<script>

/* ===== GIF BERGANTIAN ===== */

const gifs =
document.querySelectorAll('.hero-gif');

let currentGif = 0;

function changeGif(){

gifs[currentGif].classList.remove('active');

currentGif++;

if(currentGif >= gifs.length){
currentGif = 0;
}

gifs[currentGif].classList.add('active');

}

/*
  Ganti GIF setiap 4 detik.
  Semua GIF tetap berada di satu tempat.
*/
setInterval(changeGif,4000);

</script>

</body>
</html>
