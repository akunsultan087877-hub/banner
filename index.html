tio||1,2);W=stage.clientWidth;H=stage.clientHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function burst(px,py){let n=W<700?38:65,col=colors[Math.floor(Math.random()*colors.length)];for(let i=0;i<n;i++){let a=Math.PI*2*i/n+(Math.random()-.5)*.12,s=(1.3+Math.random()*2.7)*(W/1000+.45);parts.push({x:px,y:py,px,py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:.009+Math.random()*.012,col,sz:.8+Math.random()*1.7})}}function launch(){let sx=W*(.08+Math.random()*.84),ty=H*(.07+Math.random()*.32);rockets.push({x:sx,y:H*.58,px:sx,py:H*.58,vx:(Math.random()-.5)*.35,vy:-(3.5+Math.random()*2),ty,col:colors[Math.floor(Math.random()*colors.length)]})}function draw(){x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';for(let i=rockets.length-1;i>=0;i--){let r=rockets[i];r.px=r.x;r.py=r.y;r.x+=r.vx;r.y+=r.vy;r.vy+=.012;x.strokeStyle=r.col;x.lineWidth=1.2;x.globalAlpha=.75;x.beginPath();x.moveTo(r.px,r.py);x.lineTo(r.x,r.y);x.stroke();if(r.y<=r.ty){burst(r.x,r.y);rockets.splice(i,1)}}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.px=p.x;p.py=p.y;p.vx*=.988;p.vy=p.vy*.988+.018;p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;x.globalAlpha=Math.max(0,p.life);x.strokeStyle=p.col;x.lineWidth=p.sz;x.shadowBlur=6;x.shadowColor=p.col;x.beginPath();x.moveTo(p.px,p.py);x.lineTo(p.x,p.y);x.stroke();if(Math.random()<.035){x.fillStyle='#fff';x.fillRect(p.x,p.y,1,1)}if(p.life<=0)parts.splice(i,1)}x.shadowBlur=0;x.globalAlpha=1;requestAnimationFrame(draw)}setInterval(()=>{if(document.visibilityState==='visible')launch()},900);setTimeout(launch,150);setTimeout(launch,500);draw()})();</script></body></html>
