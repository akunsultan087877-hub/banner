<style>
*{box-sizing:border-box}html,body{margin:0;background:#030000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.stage{position:relative;width:100%;max-width:1536px;margin:0 auto;line-height:0;background:#050000}.art{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.tap{position:absolute;z-index:20;display:block;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:10px;outline:none;background:transparent}.tap::after{content:"";position:absolute;inset:1px;border-radius:inherit;background:rgba(255,255,255,0);box-shadow:0 0 0 rgba(255,0,0,0);transition:background .14s ease,box-shadow .14s ease,transform .14s ease}.tap:hover::after{background:rgba(255,255,255,.025);box-shadow:inset 0 0 16px rgba(255,85,50,.10),0 0 14px rgba(255,45,20,.10)}.tap:active::after{background:rgba(255,70,35,.10);box-shadow:inset 0 0 20px rgba(255,95,45,.22),0 0 18px rgba(255,45,20,.20);transform:scale(.965)}
/* HEADER — aligned to the artwork */
.home{left:23.15%;top:1.55%;width:7.50%;height:4.15%}.collection{left:31.45%;top:1.55%;width:7.10%;height:4.15%}.slot{left:39.65%;top:1.55%;width:4.80%;height:4.15%}.arcade{left:45.55%;top:1.55%;width:6.80%;height:4.15%}.hot{left:53.25%;top:1.55%;width:4.80%;height:4.15%}.promo{left:59.05%;top:1.55%;width:6.00%;height:4.15%}.contact{left:66.40%;top:1.55%;width:6.00%;height:4.15%}.login{left:80.20%;top:1.65%;width:7.25%;height:3.65%}.register{left:88.30%;top:1.65%;width:7.15%;height:3.65%}
/* HERO BUTTONS */
.hero-register{left:16.45%;top:43.20%;width:15.25%;height:4.35%}.hero-collection{left:33.05%;top:43.20%;width:13.30%;height:4.35%}
/* GAME NAV ARROWS */
.prev{left:89.70%;top:57.55%;width:3.25%;height:4.35%;border-radius:50%}.next{left:93.55%;top:57.55%;width:3.25%;height:4.35%;border-radius:50%}
/* GAME CARDS */
.game1{left:4.00%;top:63.30%;width:14.60%;height:13.40%}.game2{left:20.00%;top:63.30%;width:14.50%;height:13.40%}.game3{left:36.00%;top:63.30%;width:14.50%;height:13.40%}.game4{left:52.00%;top:63.30%;width:14.50%;height:13.40%}.game5{left:68.00%;top:63.30%;width:14.50%;height:13.40%}.game6{left:84.00%;top:63.30%;width:12.50%;height:13.40%}
/* PROMO CARDS */
.event{left:4.00%;top:78.40%;width:30.50%;height:12.00%}.cashback{left:36.00%;top:78.40%;width:30.00%;height:12.00%}.referral{left:68.00%;top:78.40%;width:29.00%;height:12.00%}
/* SOCIAL ICONS */
.social1{left:43.15%;top:95.25%;width:3.05%;height:3.15%;border-radius:50%}.social2{left:47.05%;top:95.25%;width:3.05%;height:3.15%;border-radius:50%}.social3{left:50.95%;top:95.25%;width:3.05%;height:3.15%;border-radius:50%}
@media(max-width:700px){.stage{width:100vw;max-width:none}.tap{border-radius:6px}.login,.register{min-height:28px}.hero-register,.hero-collection{min-height:30px}.prev,.next{min-width:28px;min-height:28px}}
