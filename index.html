*{box-sizing:border-box}

html,body{
    margin:0;
    background:#030000;
}

body{
    overflow-x:hidden;
}

.stage{
    position:relative;
    width:100%;
    max-width:1536px;
    margin:auto;
    line-height:0;
    background:#050000;
    overflow:hidden;
}

.art{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
}

.fx{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:18;
    pointer-events:none;
}

/* ===== GIF ===== */

.gif-slider{
    position:absolute;
    z-index:15;

    left:10.5%;
    top:20.8%;

    transform:translateX(-50%);

    width:16%;
    height:64px;

    pointer-events:none;
    overflow:visible;

    display:flex;
    align-items:center;
    justify-content:center;
}

.hero-gif{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    display:block;

    width:auto;
    height:auto;

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    opacity:0;
    visibility:hidden;

    transition:opacity .55s ease;

    filter:none;
    border:0;
    outline:0;
    box-shadow:none;
    background:transparent;
}

.hero-gif.active{
    opacity:1;
    visibility:visible;
}

/* ===== MOBILE ===== */

@media(max-width:700px){

    .gif-slider{
        left:51.5%;
        top:39.8%;

        width:20%;
        height:36px;
    }

}

/* ===== AREA CLICK ===== */

.tap{
    position:absolute;
    z-index:20;
    display:block;
    cursor:pointer;

    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;

    outline:0;
}

.tap::after{
    content:"";

    position:absolute;
    inset:-18%;

    opacity:0;
    pointer-events:none;

    background:
    radial-gradient(
        ellipse at center,
        rgba(255,245,190,.72) 0%,
        rgba(255,185,55,.38) 32%,
        rgba(255,75,25,.18) 55%,
        rgba(255,50,15,0) 78%
    );

    filter:blur(7px);

    transition:opacity .13s ease;
}

.tap:hover::after,
.tap:focus-visible::after,
.tap:active::after{
    opacity:1;
}

<script>

(()=>{

const c=document.getElementById('fireworks');

const ctx=c.getContext('2d',{
    alpha:true
});

const stage=c.parentElement;

let W=0;
let H=0;
let S=1;
let d=[];


function resize(){

    W=stage.clientWidth;
    H=stage.clientHeight;

    S=Math.min(
        devicePixelRatio||1,
        1.35
    );

    c.width=W*S;
    c.height=H*S;

    c.style.width=W+'px';
    c.style.height=H+'px';

    ctx.setTransform(
        S,0,0,S,0,0
    );

    make();
}


function make(){

    const n=
    W<700
    ?260
    :460;

    d=Array.from({
        length:n
    },()=>({

        x:Math.random()*W,

        y:Math.random()*H,

        r:1+Math.random()*2.6,

        v:.45+Math.random()*1.3,

        drift:
        (Math.random()-.5)*.24,

        a:.72+Math.random()*.28,

        tw:Math.random()*6.28

    }));

}


addEventListener(
    'resize',
    resize,
    {
        passive:true
    }
);

resize();


function frame(t){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.globalCompositeOperation='lighter';


    for(const p of d){

        p.y+=p.v;

        p.x+=
        p.drift+
        Math.sin(
            t*.0007+
            p.tw
        )*.11;


        if(p.y>H+8){

            p.y=-8;

            p.x=
            Math.random()*W;

        }


        if(p.x<-8){

            p.x=W+8;

        }


        if(p.x>W+8){

            p.x=-8;

        }


        const glow=
        .8+
        .2*
        Math.sin(
            t*.003+
            p.tw
        );


        ctx.globalAlpha=
        p.a*
        glow;


        ctx.fillStyle=
        '#ff1d14';


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.globalAlpha=
        p.a*.34;


        ctx.fillStyle=
        '#ff453a';


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r*4.2,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.globalAlpha=
        p.a*.12;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r*7,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.globalAlpha=1;

    requestAnimationFrame(
        frame
    );

}


requestAnimationFrame(
    frame
);



/* ===== GIF BERGANTIAN ===== */

const gifs=[
    ...document.querySelectorAll(
        '.hero-gif'
    )
];

let gi=0;


setInterval(()=>{

    gifs[gi]
    .classList
    .remove(
        'active'
    );


    gi=
    (gi+1)
    %
    gifs.length;


    gifs[gi]
    .classList
    .add(
        'active'
    );

},4000);


})();

</script>
