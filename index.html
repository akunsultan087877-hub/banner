<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#050000">
<title>RTP GAME STORE</title>
<style>
html,body{margin:0;background:#050000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%}
#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
</style>
</head>
<body>
<div id="loading">Memuat website…</div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/akunsultan087877-hub/banner/ee7ddef646f476ed5fbf39af622d0212366a998d/index.html';
  try{
    let html=await (await fetch(source,{cache:'no-store'})).text();
    const fix=`
<style>
.game-card{position:relative!important;z-index:50!important;pointer-events:auto!important;touch-action:manipulation!important;-webkit-tap-highlight-color:rgba(255,255,255,.16)!important}
.game-card img{pointer-events:none!important}
.nav-btn{pointer-events:auto!important;touch-action:manipulation!important;z-index:100!important}
.games-window,.games-track{pointer-events:auto!important}
#fireworksCanvas{pointer-events:none!important}
</style>
<script>
(()=>{
  function activate(){
    const track=document.getElementById('gamesTrack');
    if(!track)return;

    // Di HP/tablet, jangan biarkan script drag desktop menangkap sentuhan.
    // Swipe tetap memakai scrolling native browser, sedangkan tap membuka link.
    track.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch'||e.pointerType==='pen'){
        e.stopImmediatePropagation();
      }
    },true);

    // Pastikan semua kartu benar-benar bisa ditekan.
    track.querySelectorAll('a.game-card').forEach(card=>{
      card.style.pointerEvents='auto';
      card.style.cursor='pointer';
      card.setAttribute('role','link');
    });

    const prev=document.getElementById('prevBtn');
    const next=document.getElementById('nextBtn');
    [prev,next].forEach(btn=>{
      if(btn){btn.style.pointerEvents='auto';btn.style.cursor='pointer';}
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',activate,{once:true});
  else activate();
})();
<\/script>`;
    html=html.replace(/<\/body>/i,fix+'\n</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loading').innerHTML='Website gagal dimuat. Silakan refresh halaman.';
    console.error(err);
  }
})();
</script>
</body>
</html>
